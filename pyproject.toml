[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "openai",
    "pydantic",
    "python-dotenv",
    "tqdm",
    "pyyaml",
    "google-genai",
    "streamlit"
    
]

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentflow*"]
