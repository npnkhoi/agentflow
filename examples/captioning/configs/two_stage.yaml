name: test_two_stage
wandb_enabled: false
loader:
  source: data/items.json
  kwargs:
    image_dir: data/images
models:
  gemma:
    cls: openai
    base_url: "http://0.0.0.0:8000/v1"
    token: "-"
    model_id: SmolVLM-500M-Instruct
stages:
  - inputs:
      - [Image, human]
    output: SampleOutput
    processor: LLMProcessor
    model: gemma
  - inputs:
      - [SampleOutput, model]
    output: RefinedOutput
    processor: LLMProcessor
    model: gemma
