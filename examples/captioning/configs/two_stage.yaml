name: test_two_stage
wandb_enabled: false
loader:
  source: data/items.json
  kwargs:
    image_dir: data/images
models:
  qwen:
    cls: openai
    base_url: "http://0.0.0.0:8010/v1"
    token: "-"
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
stages:
  - inputs:
      - [Image, human]
    output: SampleOutput
    processor: LLMProcessor
    model: qwen
  - inputs:
      - [SampleOutput, model]
    output: RefinedOutput
    processor: LLMProcessor
    model: qwen
