name: test_count_with_demos
wandb_enabled: false
loader:
  source: data/items.json
  kwargs:
    image_dir: data/images
models:
  qwen:
    cls: openai
    base_url: "http://0.0.0.0:8010/v1"
    token: "-"
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
demo_pools:
  count_pool:
    source: data/demo_pool.json
    image_dir: data/images
stages:
  - inputs:
      - [Image, human]
    output: CountOutput
    processor: LLMProcessor
    model: qwen
    demo:
      pool: count_pool
      select: random
      shots: 2
